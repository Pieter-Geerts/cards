name: Release & Build

on:
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: Upload the signed AAB to Google Play Store
        required: true
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

env:
  JAVA_VERSION: '21'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pre-checks:
    name: Pre-release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
      build-number: ${{ steps.version.outputs.build-number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze project
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Extract and verify version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version_line=$(grep '^version:' pubspec.yaml | head -n 1)
          version=${version_line#version: }
          app_version=${version%%+*}
          build_number=${version#*+}

          if [[ -z "$app_version" || -z "$build_number" || "$app_version" == "$version" ]]; then
            echo 'pubspec.yaml must contain a version in the form X.Y.Z+N.' >&2
            exit 1
          fi

          if [[ "${GITHUB_REF_TYPE}" == 'tag' && "${GITHUB_REF_NAME}" != "v${app_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match pubspec version v${app_version}." >&2
            exit 1
          fi

          echo "version=$app_version" >> "$GITHUB_OUTPUT"
          echo "build-number=$build_number" >> "$GITHUB_OUTPUT"
          echo "Release version: $app_version+$build_number"

  build-android:
    name: Build signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: pre-checks
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create secrets.dart from template
        run: cp lib/secrets_template.dart lib/secrets.dart

      - name: Configure Android signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for value in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [[ -z "${!value}" ]]; then
              echo "Missing required Android signing secret: $value" >&2
              exit 1
            fi
          done

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Build Android APK
        run: flutter build apk --release

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab-v${{ needs.pre-checks.outputs.version }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk-v${{ needs.pre-checks.outputs.version }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30

  upload-to-play-store:
    name: Upload to Google Play Store
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pre-checks, build-android]
    if: inputs.upload_to_play_store == true
    steps:
      - name: Check Google Play credentials
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [[ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]]; then
            echo 'Google Play credentials are required when upload_to_play_store is enabled.' >&2
            exit 1
          fi

      - name: Download AAB artifact
        uses: actions/download-artifact@v6
        with:
          name: app-release-aab-v${{ needs.pre-checks.outputs.version }}
          path: release-artifacts

      - name: Upload to Google Play Store
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.pietergeerts.cards
          releaseFiles: release-artifacts/app-release.aab
          track: production
          status: draft

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [pre-checks, build-android]
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: app-release-*-v${{ needs.pre-checks.outputs.version }}
          merge-multiple: true
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*
          tag_name: ${{ github.ref_name }}
          name: Release ${{ needs.pre-checks.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
