version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 10
    reviewers:
      - Pieter-Geerts
    assignees:
      - Pieter-Geerts
    commit-message:
      prefix: deps
      include: scope
    labels:
      - dependencies
      - automated

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
    open-pull-requests-limit: 5
    reviewers:
      - Pieter-Geerts
    assignees:
      - Pieter-Geerts
    commit-message:
      prefix: ci
      include: scope
    labels:
      - github-actions
      - automated
